name: Verify public release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, pinned
        with:
          persist-credentials: false
      - name: Check project and evidence
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B scripts/check_project.py
      - name: Test deterministic packaging
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -B scripts/package_release.py "$RUNNER_TEMP/qeva-a.zip"
          python3 -B scripts/package_release.py "$RUNNER_TEMP/qeva-b.zip"
          cmp "$RUNNER_TEMP/qeva-a.zip" "$RUNNER_TEMP/qeva-b.zip"
          python3 -m zipfile -t "$RUNNER_TEMP/qeva-a.zip"
